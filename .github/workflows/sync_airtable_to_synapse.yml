name: Sync Airtable to Synapse

on:
  schedule:
    # Run daily at 3 AM UTC (after Synapse to Airtable sync)
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  sync:
    if: false  # Workflow disabled - do not run automatically
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run sync script
      env:
        AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        SYNAPSE_PAT: ${{ secrets.SYNAPSE_PAT }}
        AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        SYNAPSE_TABLE_ID: ${{ secrets.SYNAPSE_TABLE_ID || 'syn52677631' }}
        SYNAPSE_KEY_FIELD: ${{ secrets.SYNAPSE_KEY_FIELD }}
      run: |
        source venv/bin/activate
        python sync_airtable_to_synapse.py

